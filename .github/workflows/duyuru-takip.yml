name: TÜBİTAK Duyuru Takip

on:
  # Zamanlama artık cron-job.org'un GitHub API'sine attığı workflow_dispatch
  # istekleriyle sağlanıyor (bkz. cron-job.org paneli). GitHub'ın kendi
  # `schedule` tetikleyicisi kaldırıldı; aynı anda iki ayrı kaynağın
  # tetiklemesi kuyrukta üst üste binmeye (concurrency tıkanıklığına) yol
  # açıyordu.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duyuru-takip
  cancel-in-progress: false

jobs:
  duyuru-kontrol:
    runs-on: ubuntu-latest
    # Bir çalıştırma anormal şekilde takılırsa (GitHub runner arızası vb.)
    # concurrency kuyruğunu süresiz tıkamaması için üst sınır.
    timeout-minutes: 5
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tubitak_duyuru_bot.py

      - name: State dosyasını depoya geri yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gorulen_duyurular.json
          git diff --staged --quiet || git commit -m "State güncellendi [skip ci]"
          git push
