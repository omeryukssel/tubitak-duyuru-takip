name: TÜBİTAK Duyuru Takip

on:
  schedule:
    # Yuvarlak dakikalar (:00, :20, :40) çok yoğun olduğundan GitHub'ın
    # tetiklemeyi geciktirmesini/atlamasını önlemek için kaydırılmış dakikalar
    # kullanılıyor (:07, :27, :47).
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duyuru-takip
  cancel-in-progress: false

jobs:
  duyuru-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tubitak_duyuru_bot.py

      - name: State dosyasını depoya geri yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gorulen_duyurular.json
          git diff --staged --quiet || git commit -m "State güncellendi [skip ci]"
          git push
